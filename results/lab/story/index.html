<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PipedPeer · lab campaign</title>
<style>/* One system sans, tight display tracking, a dark plane with charts on a
   raised surface. Tokens mirror core.js's THEMES (the charts write theirs as
   SVG attributes; the HTML around them reads these). */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0b0a; --surface: #141413; --raised: #1b1b19; --cell: #22221f;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8d86; --grid: #252523; --axis: #3a3a37;
  --border: rgba(255,255,255,0.08); --good: #0ca30c; --bad: #e66767;
  --c-plain: #8f8d86; --c-pipedpeer: #3987e5; --c-ray: #d95926; --c-dask: #199e70;
  --glow: rgba(57,135,229,0.16);
}
[data-theme="light"] {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --raised: #ffffff; --cell: #ecebe6;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #76746e; --grid: #e6e5df; --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10); --good: #006300; --bad: #c22f2f;
  --c-plain: #898781; --c-pipedpeer: #2a78d6; --c-ray: #eb6834; --c-dask: #1baf7a;
  --glow: rgba(42,120,214,0.10);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--page); color: var(--ink2);
  font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  transition: background .3s ease, color .3s ease;
}
#app { min-height: 100vh; }
a { color: inherit; }
h1, h2, h3, h4 { color: var(--ink); margin: 0; font-weight: 680; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px;
  padding: 12px clamp(20px, 4vw, 48px); background: color-mix(in srgb, var(--page) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; letter-spacing: -0.01em; }
.brand-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c-pipedpeer); box-shadow: 0 0 16px var(--c-pipedpeer); }
.brand-sub { color: var(--muted); font-weight: 450; font-size: 14px; }
.topstamp { justify-self: center; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.theme-toggle, .ctl, .seg button, .pick {
  font: inherit; font-size: 13px; color: var(--ink2); background: var(--raised); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: border-color .2s, color .2s;
}
.theme-toggle:hover, .ctl:hover, .seg button:hover { color: var(--ink); border-color: var(--axis); }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--c-pipedpeer); transform-origin: 0 50%; transform: scaleX(0); }

/* masthead */
.mast { max-width: 1280px; margin: 0 auto; padding: clamp(48px, 9vh, 120px) clamp(20px, 4vw, 48px) 40px; position: relative; }
.mast::before { content: ""; position: absolute; inset: -80px 0 auto 0; height: 520px; pointer-events: none;
  background: radial-gradient(60% 60% at 30% 30%, var(--glow), transparent 70%); }
.kicker, .chapter-num { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-size: clamp(40px, 6.1vw, 92px); line-height: .98; letter-spacing: -0.045em; margin: 18px 0 26px; font-weight: 720; position: relative; }
h1 .dim { color: var(--muted); }
.dek { font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; max-width: 760px; color: var(--ink2); margin: 0 0 28px; letter-spacing: -0.005em; }
.banner { max-width: 760px; font-size: 14.5px; line-height: 1.55; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink2); margin-bottom: 40px; border-left: 3px solid var(--muted); }
.banner b { color: var(--ink); }

/* hero */
.hero-host { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: clamp(16px, 2.4vw, 32px);
  box-shadow: 0 40px 120px -40px rgba(0,0,0,.55); }
.hero-stage { width: 100%; }
.hero-canvas { width: 100%; display: block; }
.controls { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.ctl.play { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; font-size: 13px; color: var(--ink); }
.scrub { flex: 1; min-width: 160px; accent-color: var(--c-pipedpeer); }
.ctl-time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink2); min-width: 78px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--raised); }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12px; }
.seg button.on { background: var(--cell); color: var(--ink); }
.hero-meta { margin-top: 12px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.chip { display: inline-block; border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }
.callout { margin: 28px 0 0; max-width: 860px; padding: 18px 22px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.callout-k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 650; color: var(--ink); margin-bottom: 6px; }
.callout p { margin: 0; font-size: 15px; line-height: 1.6; }

/* chapter nav */
.chapnav { position: sticky; top: 57px; z-index: 15; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; padding: 10px 16px;
  background: color-mix(in srgb, var(--page) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.chapnav a { text-decoration: none; font-size: 13px; color: var(--muted); padding: 4px 12px; border-radius: 999px; transition: color .2s, background .2s; }
.chapnav a span { font-variant-numeric: tabular-nums; margin-right: 6px; opacity: .6; }
.chapnav a:hover, .chapnav a.on { color: var(--ink); background: var(--raised); }

/* chapters */
.chapter { max-width: 1280px; margin: 0 auto; padding: clamp(72px, 12vh, 140px) clamp(20px, 4vw, 48px) 24px;
  opacity: .001; transform: translateY(24px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
.chapter.in, .chapter.method { opacity: 1; transform: none; }
.chapter-head { max-width: 820px; margin-bottom: 36px; }
h2 { font-size: clamp(34px, 4.6vw, 64px); line-height: 1.02; letter-spacing: -0.035em; margin: 12px 0 18px; }
.lede { font-size: clamp(17px, 1.35vw, 20px); line-height: 1.55; margin: 0; color: var(--ink2); max-width: 720px; }
.chapter-body { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: clamp(18px, 2.6vw, 36px); }
.chapter-sub { margin-top: 32px; padding-top: 28px; border-top: 1px solid var(--border); }
.mini-title { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; color: var(--ink2); margin-bottom: 12px; }

/* headline numbers */
.fig-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px; margin-bottom: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
.fig-value { font-size: clamp(40px, 4.4vw, 64px); line-height: 1; font-weight: 700; letter-spacing: -0.04em; color: var(--ink); display: flex; align-items: center; gap: 14px; }
.fig-mark { width: 12px; height: 12px; border-radius: 50%; flex: none; transform: translateY(2px); }
.fig.good .fig-value { color: var(--good); }
.fig.bad .fig-value { color: var(--bad); }
.fig-label { margin-top: 10px; font-size: 14px; line-height: 1.45; color: var(--ink2); max-width: 360px; }
.stamp { margin-top: 8px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

/* charts */
.chart-host { width: 100%; position: relative; }
.chart-host svg { display: block; overflow: visible; }
.multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px 32px; margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 14px 0 8px; font-size: 13px; color: var(--ink2); }
.lg-item { display: inline-flex; align-items: center; gap: 8px; }
.lg-mark { display: inline-flex; }
.slider { display: flex; align-items: center; gap: 16px; margin: 0 0 6px; font-size: 14px; }
.slider input { width: min(320px, 50vw); accent-color: var(--c-pipedpeer); }
.slider output { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.replay-ctl { margin-top: 10px; }
.toolbar { margin-bottom: 18px; }
.pick { border-radius: 10px; padding: 8px 12px; max-width: 100%; }
.lanes-split { display: grid; grid-template-columns: 1.7fr 1fr; gap: 36px; }
@media (max-width: 900px) { .lanes-split { grid-template-columns: 1fr; } }

/* badges */
.badge { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; }
.badge.ok { color: var(--good); } .badge.bad { color: var(--bad); }

/* losses */
.loss-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 22px; }
@media (max-width: 520px) { .loss-grid { grid-template-columns: 1fr; } }
.loss { background: var(--raised); border: 1px solid var(--border); border-radius: 16px; padding: 22px 22px 16px; border-top: 3px solid var(--ink2); }
.loss-tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; display: flex; gap: 8px; align-items: center; }
.loss-icon { color: var(--ink); font-size: 10px; }
.loss h3 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.15; margin: 10px 0 8px; }
.loss p { font-size: 14.5px; line-height: 1.55; margin: 0 0 14px; }

/* table view */
.table-view { margin-top: 16px; font-size: 13px; }
.table-view summary { cursor: pointer; color: var(--muted); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.table-view summary::before { content: "▸"; transition: transform .2s; }
.table-view[open] summary::before { transform: rotate(90deg); }
.table-view summary:hover { color: var(--ink); }
.table-wrap { overflow-x: auto; margin-top: 10px; }
table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--axis); padding: 6px 12px 6px 0; white-space: nowrap; }
table.data td { border-bottom: 1px solid var(--grid); padding: 6px 12px 6px 0; color: var(--ink2); }

/* placeholder */
.placeholder { position: relative; border: 1px dashed var(--axis); border-radius: 16px; min-height: 220px; display: grid; place-items: center; overflow: hidden; padding: 32px; }
.ph-grid { position: absolute; inset: 0; opacity: .5;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px; mask-image: radial-gradient(closest-side, black, transparent); -webkit-mask-image: radial-gradient(closest-side, black, transparent); }
.ph-body { position: relative; text-align: center; max-width: 520px; }
.ph-kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--c-pipedpeer); font-weight: 700; }
.ph-what { margin-top: 10px; font-size: 18px; color: var(--ink); line-height: 1.45; letter-spacing: -0.01em; }
.ph-needs { margin-top: 8px; font-size: 13px; color: var(--muted); }
.ph-inline { margin: 14px 0 0; font-size: 13.5px; color: var(--ink2); padding: 10px 14px; border: 1px dashed var(--axis); border-radius: 10px; }
.ph-inline .ph-kicker { margin-right: 8px; font-size: 11px; }

/* method + footer */
.method .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px; }
.method h4 { font-size: 15px; margin-bottom: 8px; }
.method p { font-size: 14.5px; line-height: 1.6; margin: 0 0 10px; }
pre { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 13px; color: var(--ink); }
.foot { max-width: 1280px; margin: 40px auto 0; padding: 32px clamp(20px, 4vw, 48px) 64px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--border); }

/* tooltip */
.tip { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .12s;
  background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; color: var(--ink2);
  box-shadow: 0 12px 32px rgba(0,0,0,.35); min-width: 140px; }
.tip-title { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
.tip-row { display: flex; gap: 8px; align-items: center; }
.tip-row b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.tip-key { width: 12px; height: 2px; border-radius: 1px; flex: none; }

/* the hero alone at 1920x1080, for the video */
body.export-hero { overflow: hidden; }
body.export-hero .hero-host { width: 1920px; height: 1080px; border-radius: 0; border: 0; padding: 120px 72px 40px; box-shadow: none; position: relative; }
body.export-hero .hero-host::before { content: attr(data-title); position: absolute; left: 72px; top: 44px; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
body.export-hero .hero-host::after { content: attr(data-stamp); position: absolute; right: 72px; top: 58px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
body.export-hero .controls .seg, body.export-hero .controls .play { display: none; }
body.export-hero .hero-meta { font-size: 15px; }

@media (prefers-reduced-motion: reduce) { .chapter { transition: none; opacity: 1; transform: none; } html { scroll-behavior: auto; } }
@media (max-width: 720px) { .topstamp { display: none; } .topbar { grid-template-columns: auto 1fr auto; } .chapnav { top: 53px; } }
@media print { .topbar, .chapnav, .controls, .replay-ctl { display: none; } .chapter { opacity: 1; transform: none; break-inside: avoid; } }
</style>
</head>

<script>// --- core.js
// The page's shared state and helpers: the model, the theme tokens (both
// modes stepped from one validated palette), formatting, the tooltip, table
// views, placeholders, and the registry every chart draws through so a theme
// switch or a resize redraws everything from the same model.
const M = JSON.parse(document.getElementById("story-data").textContent);
const SYS = ["pipedpeer", "ray", "dask"];
const ALL = ["plain", "pipedpeer", "ray", "dask"];
const NAME = { plain: "plain Python", pipedpeer: "PipedPeer", ray: "Ray", dask: "Dask" };
// Marker shape per system: identity never rests on colour alone.
const SHAPE = { plain: d3.symbolDiamond, pipedpeer: d3.symbolCircle, ray: d3.symbolSquare, dask: d3.symbolTriangle };
const FAMILY = { "pipedpeer-shim": "pipedpeer", "pipedpeer-noshim": "plain", "pipedpeer-exact": "pipedpeer",
  "pipedpeer-fast": "pipedpeer", "pipedpeer-headcount": "pipedpeer", torchrun: "ray" };
const fam = (s) => (NAME[s] ? s : FAMILY[s] || "plain");

// validate_palette.js --pairs all: slots 1-3 pass in both modes against these surfaces.
const THEMES = {
  dark: {
    mode: "dark", page: "#0b0b0a", surface: "#141413", raised: "#1b1b19", cell: "#22221f",
    ink: "#f0efec", ink2: "#c3c2b7", muted: "#8f8d86", grid: "#252523", axis: "#3a3a37",
    border: "rgba(255,255,255,0.08)", good: "#0ca30c", bad: "#e66767",
    sys: { plain: "#8f8d86", pipedpeer: "#3987e5", ray: "#d95926", dask: "#199e70" },
  },
  light: {
    mode: "light", page: "#f4f4f1", surface: "#fcfcfb", raised: "#ffffff", cell: "#ecebe6",
    ink: "#0b0b0b", ink2: "#52514e", muted: "#76746e", grid: "#e6e5df", axis: "#c3c2b7",
    border: "rgba(11,11,11,0.10)", good: "#006300", bad: "#c22f2f",
    sys: { plain: "#898781", pipedpeer: "#2a78d6", ray: "#eb6834", dask: "#1baf7a" },
  },
};
let THEME = THEMES[localStorage.getItem("story-theme") || (new URLSearchParams(location.search).get("theme")) || "dark"] || THEMES.dark;
const T = () => THEME;
const C = (s) => THEME.sys[fam(s)];
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const STAMP = M.meta.emulated ? "Emulated · container lab · sample sizes · not a result" : "";

// --- formatting ------------------------------------------------------------
const f1 = d3.format(".1f"), f2 = d3.format(".2f"), f0 = d3.format(",d");
const fmtS = (s) => (s == null ? "–" : s >= 100 ? f0(Math.round(s)) + " s" : s >= 10 ? f1(s) + " s" : f2(s) + " s");
const fmtX = (x) => (x == null ? "–" : f2(x) + "×");
const fmtB = (b) => (b == null ? "–" : b >= 1e9 ? f1(b / 1e9) + " GB" : b >= 1e6 ? f1(b / 1e6) + " MB" : b >= 1e3 ? f0(Math.round(b / 1e3)) + " kB" : f0(b) + " B");
const pcSort = (a, b) => (+(a.match(/\d+$/) || [1e9])[0]) - (+(b.match(/\d+$/) || [1e9])[0]) || d3.ascending(a, b);

// --- DOM -------------------------------------------------------------------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {

      const [ax, ay, bx, by] = f.out ? [sx, sy, tx, ty] : [tx, ty, sx, sy];
      const mx = (ax + bx) / 2, my = (ay + by) / 2 - Math.max(18, Math.hypot(bx - ax, by - ay) * 0.22);
      for (let j = 0; j < f.k; j++) {
        const q = Math.max(0, Math.min(1, p - j * 0.06));
        if (q <= 0 || q >= 1) continue;
        const e = d3.easeCubicInOut(q);
        const px = (1 - e) * (1 - e) * ax + 2 * (1 - e) * e * mx + e * e * bx;
        const py = (1 - e) * (1 - e) * ay + 2 * (1 - e) * e * my + e * e * by;
        ctx.beginPath();
        ctx.arc(px, py, f.out ? (L.big ? 4 : 3) : (L.big ? 3 : 2.2), 0, 7);
        ctx.fillStyle = f.out ? col : th.ink2;
        ctx.globalAlpha = f.out ? 0.95 : 0.7;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawSpark(s, th, L, col) {
    const y0 = L.sparkY, h = L.spark - 18, w = L.colW;
    const x = d3.scaleLinear([T0, T1], [0, w]), y = d3.scaleLinear([0, peak], [y0 + h, y0]);
    ctx.strokeStyle = th.grid;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y0 + h + 0.5); ctx.lineTo(w, y0 + h + 0.5); ctx.stroke();
    const pts = totals[s];
    const area = d3.area().x((p) => x(p[0])).y0(y0 + h).y1((p) => y(p[1])).curve(d3.curveMonotoneX).context(ctx);
    ctx.beginPath(); area(pts); ctx.fillStyle = col; ctx.globalAlpha = 0.07; ctx.fill(); ctx.globalAlpha = 1;
    const shown = pts.filter((p) => p[0] <= t);
    ctx.beginPath(); d3.line().x((p) => x(p[0])).y((p) => y(p[1])).curve(d3.curveMonotoneX).context(ctx)(shown);
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
    const wx = x(H.systems[s].wall || 0);
    ctx.fillStyle = th.muted; ctx.font = `400 ${L.big ? 13 : 10.5}px ${FONT}`; ctx.textBaseline = "alphabetic";
    ctx.fillText("busy cores, all PCs", 0, y0 - 6);
    ctx.textAlign = wx > w - 60 ? "right" : "left";
    ctx.fillText(`end ${fmtS(H.systems[s].wall)}`, wx + (wx > w - 60 ? -4 : 4), y0 + h + 13);
    ctx.textAlign = "left";
    ctx.strokeStyle = th.axis; ctx.beginPath(); ctx.moveTo(wx, y0 + 2); ctx.lineTo(wx, y0 + h); ctx.stroke();
    const px = x(Math.max(T0, Math.min(T1, t)));
    ctx.strokeStyle = th.ink; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(px, y0); ctx.lineTo(px, y0 + h); ctx.stroke(); ctx.globalAlpha = 1;
  }

  function frame(now) {
    if (!playing) return;
    if (last != null) t += ((now - last) / 1000) * speed;
    last = now;
    if (t > T1 + 1.2) t = T0;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function play() { if (!H) return; if (t >= T1) t = T0; playing = true; last = null; setPlayIcon(); raf = requestAnimationFrame(frame); }
  function pause() { playing = false; cancelAnimationFrame(raf); setPlayIcon(); }
  function setPlayIcon() { if (ui.play) { ui.play.textContent = playing ? "❚❚" : "▶"; ui.play.setAttribute("aria-label", playing ? "Pause" : "Play"); } }
  function seek(v) { pause(); t = v; draw(); }

  return { mount, play, pause, seek, draw, redraw: () => canvas && size(), range: [T0, T1], ok: !!H };
})();

// --- scaling.js
// Strong scaling (E1) and the lines-of-code frontier. Speedup is plain at
// N = 1 over the system's median wall at N, from analyse.group's rows.
const E1 = (M.groups.e1 || []).filter((r) => r.mode !== "weak");
const WORKLOADS = [...new Set(E1.map((r) => r.workload))].sort();
const NS = [...new Set(E1.filter((r) => r.system !== "plain").map((r) => r.n))].sort((a, b) => a - b);
const NMAX = d3.max(NS) || 1;
const sp = (w, s, n) => (E1.find((r) => r.workload === w && r.system === s && r.n === n) || {}).speedup_vs_plain;
const row = (w, s, n) => E1.find((r) => r.workload === w && r.system === s && r.n === n);

const Scaling = {
  n: NMAX,
  mount(root) {
    if (!E1.length) return placeholder(root, "Strong scaling: speedup over plain Python at N = 1, 4 and 16, per workload.", "Needs E1 lines in runs.jsonl.");
    const head = el("div", { class: "fig-row" });
    const ctrl = el("div", { class: "slider" },
      el("label", { for: "nslider", text: "N, PCs in the run" }),
      el("input", { id: "nslider", type: "range", min: 0, max: NS.length - 1, step: 1, value: NS.length - 1,
        oninput: (e) => { this.n = NS[+e.target.value]; out.textContent = "N = " + this.n; this.update(); } }),
      el("output", { text: "N = " + NMAX }));
    const out = ctrl.querySelector("output");
    const grid = el("div", { class: "multiples" });
    root.replaceChildren(head, ctrl, legend(SYS.concat("plain"), { line: true, label: (s) => (s === "plain" ? "ideal (N×)" : NAME[s]) }), grid,
      tableView([["Workload", (r) => r.workload], ["System", (r) => NAME[fam(r.system)] || r.system], ["N", (r) => r.n],
        ["Wall s, median [IQR]", (r) => (r.median_wall_s == null ? "–" : `${f2(r.median_wall_s)} [${f2(r.q1_wall_s)}–${f2(r.q3_wall_s)}]`)],
        ["Speedup", (r) => fmtX(r.speedup_vs_plain)], ["Used / failed", (r) => `${r.runs_used} / ${r.failed_excluded}`]], E1));
    this.head = head;
    this.cells = WORKLOADS.map((w) => {
      const c = el("div", { class: "multiple" });
      grid.append(c);
      return { w, c, item: chart(c, (t) => this.drawOne(t, w)) };
    });
    this.update();
  },
  update() {
    const n = this.n;
    const best = (s) => d3.max(WORKLOADS, (w) => sp(w, s, n));
    this.head.replaceChildren(...SYS.map((s) => figure(fmtX(best(s)), `${NAME[s]}: best speedup at N = ${n}, any workload`, { mark: s })));
    for (const c of this.cells || []) c.item.draw(c.c);
  },
  drawOne(target, w) {
    const f = frame(target, { height: 230, margin: { left: 40, right: 64, top: 30, bottom: 30 }, minWidth: 220, name: `scaling-${w}` });
    const x = (NS.length > 2 ? d3.scaleLog().base(2) : d3.scaleLinear()).domain([1, NMAX]).range([0, f.w]);
    const ymax = Math.max(NMAX, d3.max(SYS, (s) => d3.max(NS, (n) => sp(w, s, n) || 0)) || 1) * 1.08;
    const y = d3.scaleLinear([0, ymax], [f.h, 0]).nice();
    text(f.svg, 0, 16, w, { size: 13, weight: 650, fill: T().ink });
    // Below 1: slower than plain on one PC.
    f.g.append("rect").attr("x", 0).attr("width", f.w).attr("y", y(1)).attr("height", f.h - y(1)).attr("fill", T().ink).attr("opacity", 0.035);
    axisLeft(f, y, { ticks: 4, format: (v) => v + "×" });
    axisBottom(f, x, { values: NS.length ? [1].concat(NS.filter((n) => n > 1)) : [1], format: d3.format("d") });
    f.g.append("line").attr("x1", x(1)).attr("x2", x(NMAX)).attr("y1", y(1)).attr("y2", y(Math.min(NMAX, ymax))).attr("stroke", T().muted).attr("stroke-width", 1).attr("opacity", 0.6);
    text(f.g, f.w - 4, f.h - 6, "slower than plain", { size: 10, fill: T().muted, anchor: "end" });
    const nx = x(this.n);
    f.g.append("line").attr("x1", nx).attr("x2", nx).attr("y1", 0).attr("y2", f.h).attr("stroke", T().ink2).attr("opacity", 0.35);
    const labels = [];
    for (const s of SYS) {
      const pts = [1].concat(NS).filter((v, i, a) => a.indexOf(v) === i).map((n) => [n, sp(w, s, n)]).filter((p) => p[1] != null);
      if (!pts.length) continue;
      f.g.append("path").attr("d", d3.line().x((p) => x(p[0])).y((p) => y(p[1]))(pts)).attr("fill", "none")
        .attr("stroke", C(s)).attr("stroke-width", 2).attr("stroke-linejoin", "round").attr("stroke-linecap", "round");
      for (const [n, v] of pts) {
        const r = row(w, s, n);
        marker(f.g, s, x(n), y(v), n === this.n ? 90 : 46);
        hit(f.g, x(n), y(v), 12, (ev) => tip.show(ev, `${w} · ${NAME[s]} · N = ${n}`, [[C(s), fmtX(v), "speedup vs plain at N = 1"],
          [null, fmtS(r.median_wall_s), `median wall, ${r.runs_used} runs${r.failed_excluded ? `, ${r.failed_excluded} failed` : ""}`]]));
      }
      const at = pts.find((p) => p[0] === this.n);
      if (at) labels.push({ s, y: y(at[1]), v: at[1] });
    }
    // End labels at the slider's N; leader lines when they would collide.
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) labels[i].ly = Math.max(labels[i].y, (labels[i - 1].ly ?? labels[i - 1].y) + 13);
    for (const l of labels) {
      const ly = l.ly ?? l.y;
      if (Math.abs(ly - l.y) > 2) f.g.append("line").attr("x1", nx + 6).attr("x2", nx + 12).attr("y1", l.y).attr("y2", ly).attr("stroke", T().axis);
      text(f.g, Math.min(f.w + 4, nx + 14), ly, fmtX(l.v), { size: 11, baseline: "middle", fill: T().ink2, weight: l.s === "pipedpeer" ? 650 : 400 });
    }
    const failed = SYS.filter((s) => { const r = row(w, s, this.n); return r && r.failed_excluded; });
    if (failed.length) text(f.svg, f.width - 8, 16, "failed runs: " + failed.map((s) => NAME[s] + " " + row(w, s, this.n).failed_excluded).join(", "), { size: 10.5, anchor: "end", fill: T().muted });
  },
};

const Frontier = {
  mount(root) {
    const pl = M.port_lines || [];
    const pts = [];
    for (const w of WORKLOADS) for (const s of SYS) {
      const v = sp(w, s, NMAX), l = pl.find((p) => p.workload === w && p.system === s);
      if (v != null && l) pts.push({ w, s, v, lines: l.lines });
    }
    if (!pts.length) return placeholder(root, "Lines changed to the script against speedup at the largest N.", "Needs port-lines.csv and E1 speedups.");
    const lines = (s) => pl.filter((p) => p.system === s).map((p) => p.lines);
    root.replaceChildren(el("div", { class: "fig-row" },
      figure("0", "lines changed for PipedPeer, every workload", { mark: "pipedpeer", noStamp: true }),
      figure(`${d3.min(lines("ray"))}–${d3.max(lines("ray"))}`, "lines changed for Ray", { mark: "ray", noStamp: true }),
      figure(`${d3.min(lines("dask"))}–${d3.max(lines("dask"))}`, "lines changed for Dask", { mark: "dask", noStamp: true })),
    el("div", { class: "chart-host" }), legend(SYS),
    tableView([["Workload", (p) => p.w], ["System", (p) => NAME[p.s]], ["Lines changed", (p) => p.lines], [`Speedup at N = ${NMAX}`, (p) => fmtX(p.v)]], pts));
    chart(root.querySelector(".chart-host"), (t) => this.draw(t, pts));
  },
  draw(target, pts) {
    const f = frame(target, { height: 380, margin: { left: 52, right: 30, top: 24, bottom: 46 }, name: "frontier" });
    const x = d3.scaleLinear([-0.6, d3.max(pts, (p) => p.lines) + 1.5], [0, f.w]);
    const y = d3.scaleLinear([0, Math.max(1.2, d3.max(pts, (p) => p.v) * 1.12)], [f.h, 0]).nice();
    axisLeft(f, y, { ticks: 5, format: (v) => v + "×", label: `speedup at N = ${NMAX}` });
    axisBottom(f, x, { ticks: 8, format: d3.format("d"), label: "lines changed in the script" });
    f.g.append("line").attr("x1", 0).attr("x2", f.w).attr("y1", y(1)).attr("y2", y(1)).attr("stroke", T().muted).attr("opacity", 0.5);
    text(f.g, f.w, y(1) - 6, "plain Python on one PC", { size: 10.5, fill: T().muted, anchor: "end" });
    // The no-edit column.
    f.g.append("rect").attr("x", x(-0.45)).attr("width", x(0.45) - x(-0.45)).attr("y", 0).attr("height", f.h).attr("rx", 6)
      .attr("fill", C("pipedpeer")).attr("opacity", 0.08);
    text(f.g, x(0) + 14, 12, "no edits", { size: 11, weight: 650, fill: T().ink2 });
    const sorted = pts.slice().sort((a, b) => a.v - b.v);
    const placed = [];
    for (const p of sorted) {
      const px = x(p.lines), py = y(p.v);
      marker(f.g, p.s, px, py, 80);
      hit(f.g, px, py, 12, (ev) => tip.show(ev, `${p.w} · ${NAME[p.s]}`, [[C(p.s), fmtX(p.v), `speedup at N = ${NMAX}`], [null, String(p.lines), "lines changed"]]));
      let ly = py;
      while (placed.some((q) => Math.abs(q.x - px) < 30 && Math.abs(q.y - ly) < 12)) ly -= 12;
      placed.push({ x: px, y: ly });
      text(f.g, px + 9, ly, p.w, { size: 10.5, baseline: "middle", fill: T().muted });
    }
  },
};

// --- headline.js
// The headline experiments: E12 elastic join, E13 churn, E14 curl to
// cluster, E15 network delay. Join and churn replay on scroll: a playhead
// sweeps the run and a strip of PC tiles lights with each PC's items per
// second, going dark while it is killed.
const series = (vals, bin) => vals.map((v, i) => [i * bin, v]);
const atBin = (vals, bin, t) => vals[Math.min(vals.length - 1, Math.max(0, Math.floor(t / bin)))] || 0;

// A strip of PC tiles at the left of a timeline panel; returns update(t).
function tileStrip(g, pcs, y0, rowH, opts) {
  const tiles = pcs.map((pc, i) => {
    const y = y0 + i * rowH;
    const gg = g.append("g").attr("transform", `translate(0,${y})`);
    const box = gg.append("rect").attr("width", 62).attr("height", rowH - 6).attr("rx", 6).attr("fill", T().raised).attr("stroke", T().border);
    const dot = gg.append("rect").attr("x", 7).attr("y", (rowH - 6) / 2 - 5).attr("width", 10).attr("height", 10).attr("rx", 2.5).attr("fill", T().cell);
    const lab = gg.append("text").attr("x", 23).attr("y", (rowH - 6) / 2).attr("dominant-baseline", "middle")
      .attr("font-size", 11).attr("font-weight", 600).attr("fill", T().ink2).text(pc);
    return { pc, gg, box, dot, lab };
  });
  return (t) => {
    for (const k of tiles) {
      const st = opts.state(k.pc, t); // {present, down, level 0..1}
      k.gg.attr("opacity", st.present ? 1 : 0.28);
      k.dot.attr("fill", st.down ? T().page : st.level > 0.02 ? opts.color : T().cell).attr("opacity", st.down ? 1 : 0.35 + 0.65 * st.level);
      k.box.attr("stroke", st.down ? T().bad : st.flash ? opts.color : T().border).attr("stroke-width", st.down || st.flash ? 1.5 : 1);
      k.lab.text(st.down ? `✕ ${k.pc}` : k.pc).attr("fill", st.down ? T().bad : T().ink2);
    }
  };
}

const Join = {
  mount(root) {
    const J = M.join || [];
    if (!J.length) return placeholder(root, "Elastic join: PCs added while a job runs, and whether each system gives them work.",
      "Needs E12 lines (experiment e12) with a per-PC timeline and join events.");
    const share = (j) => {
      const tot = d3.sum(Object.values(j.per_pc), (v) => d3.sum(v));
      const late = d3.sum(Object.entries(j.per_pc).filter(([pc]) => (j.cohorts[pc] || 0) > 0), ([, v]) => d3.sum(v));
      return tot ? late / tot : null;
    };
    const host = el("div", { class: "chart-host" });
    root.replaceChildren(el("div", { class: "fig-row" }, J.map((j) => figure(j.result_ok === false ? "failed" : d3.format(".0%")(share(j) || 0),
      `${NAME[j.system]}: share of items the joiner${j.events.flatMap((e) => e.pcs).length > 1 ? "s" : ""} ran · wall ${fmtS(j.wall)}`, { mark: j.system }))),
    host, el("div", { class: "replay-ctl" }, el("button", { class: "ctl", text: "↻ Replay", onclick: () => this.rp && this.rp.play() })),
    tableView([["System", (j) => NAME[j.system]], ["Start → final PCs", (j) => `${j.hosts.length} → ${j.hosts_final.length}`],
      ["Join at", (j) => j.events.map((e) => `${f1(e.t)} s (+${e.pcs.join(", ")})`).join("; ")],
      ["Seen by system", (j) => j.events.map((e) => (e.seen == null ? "not reported" : f1(e.seen) + " s")).join("; ")],
      ["Joiner's share", (j) => d3.format(".1%")(share(j) || 0)], ["Wall", (j) => fmtS(j.wall)], ["Source", (j) => j.source || "–"]], J));
    chart(host, (t) => this.draw(t, J));
    onEnter(host, () => this.rp && this.rp.play());
  },
  draw(target, J) {
    const rowH = 30, panelGap = 30;
    const pcsOf = (j) => [...new Set(j.hosts_final.concat(Object.keys(j.per_pc)))].sort(pcSort);
    const heights = J.map((j) => Math.max(110, pcsOf(j).length * rowH + 30));
    const f = frame(target, { height: d3.sum(heights) + panelGap * (J.length - 1) + 60, margin: { left: 80, right: 150, top: 20, bottom: 36 }, name: "e12-join" });
    const tmax = d3.max(J, (j) => j.wall || j.per_pc && d3.max(Object.values(j.per_pc), (v) => v.length * j.bin_s));
    const x = d3.scaleLinear([0, tmax], [0, f.w]);
    const ymax = d3.max(J, (j) => d3.max(d3.range(d3.max(Object.values(j.per_pc), (v) => v.length)), (i) => d3.sum(Object.values(j.per_pc), (v) => v[i] || 0)));
    const updates = [];
    const clipId = "joinclip" + Math.random().toString(36).slice(2, 7);
    const clip = f.svg.append("defs").append("clipPath").attr("id", clipId).append("rect").attr("x", 0).attr("y", -10).attr("height", f.h + 20).attr("width", f.w);
    let y0 = 0;
    J.forEach((j, idx) => {
      const ph = heights[idx];
      const g = f.g.append("g").attr("transform", `translate(0,${y0})`);
      const y = d3.scaleLinear([0, ymax * 1.05], [ph - 26, 4]);
      const n = d3.max(Object.values(j.per_pc), (v) => v.length);
      const cohorts = [...new Set(Object.values(j.cohorts))].sort();
      let base = d3.range(n).map(() => 0);
      const layers = cohorts.map((k) => {
        const pcs = Object.keys(j.per_pc).filter((pc) => (j.cohorts[pc] || 0) === k);
        const vals = d3.range(n).map((i) => d3.sum(pcs, (pc) => j.per_pc[pc][i] || 0));
        const lo = base, hi = base.map((b, i) => b + vals[i]);
        base = hi;
        return { k, pcs, lo, hi };
      });
      g.append("line").attr("x1", 0).attr("x2", f.w).attr("y1", ph - 26).attr("y2", ph - 26).attr("stroke", T().axis);
      const plot = g.append("g").attr("clip-path", `url(#${clipId})`);
      for (const L of layers) {
        const pts = d3.range(n + 1).map((i) => [i * j.bin_s, L.lo[Math.min(i, n - 1)], L.hi[Math.min(i, n - 1)]]);
        plot.append("path").attr("d", d3.area().curve(d3.curveStepAfter).x((d) => x(d[0])).y0((d) => y(d[1])).y1((d) => y(d[2]))(pts))
          .attr("fill", C(j.system)).attr("opacity", L.k === 0 ? 0.3 : 0.9);
        plot.append("path").attr("d", d3.line().curve(d3.curveStepAfter).x((d) => x(d[0])).y((d) => y(d[2]))(pts))
          .attr("fill", "none").attr("stroke", L.k === 0 ? C(j.system) : T().surface).attr("stroke-width", L.k === 0 ? 1.5 : 2);
      }
      for (const e of j.events) {
        rule(g, x(e.t), ph - 26, `+${e.pcs.join(", ")} joins`, { y0: 0 });
        if (e.seen != null) {
          g.append("path").attr("d", d3.symbol(d3.symbolTriangle, 36)()).attr("transform", `translate(${x(e.seen)},${ph - 20})`).attr("fill", T().ink2);
          text(g, x(e.seen) + 6, ph - 14, "listed", { size: 10, fill: T().muted });
        }
      }
      text(g, f.w + 12, 14, NAME[j.system], { size: 13, weight: 650, fill: T().ink });
      text(g, f.w + 12, 31, `wall ${fmtS(j.wall)}`, { size: 11.5, fill: T().ink2 });
      text(g, f.w + 12, 47, j.result_ok === false ? "✕ wrong or failed" : "✓ result correct", { size: 11.5, fill: j.result_ok === false ? T().bad : T().good });
      text(g, f.w + 12, 63, `${j.n_start ?? j.hosts.length}→${j.n_final ?? j.hosts_final.length} workers`, { size: 11, fill: T().muted });
      const pcs = pcsOf(j);
      const tot = Object.fromEntries(Object.entries(j.per_pc).map(([pc, v]) => [pc, d3.sum(v)]));
      const maxTot = d3.max(Object.values(tot)) || 1;
      const joinAt = (pc) => { const e = j.events.find((ev) => ev.pcs.includes(pc)); return e ? e.t : null; };
      const strip = tileStrip(g.append("g").attr("transform", `translate(${-f.m.left + 8},0)`), pcs, 0, rowH, {
        color: C(j.system),
        state: (pc, t) => {
          const ja = joinAt(pc);
          const v = j.per_pc[pc] ? atBin(j.per_pc[pc], j.bin_s, t) : 0;
          const peak = j.per_pc[pc] ? d3.max(j.per_pc[pc]) || 1 : 1;
          if (t >= (j.wall || 1e9)) return { present: true, level: (tot[pc] || 0) / maxTot };
          return { present: ja == null || t >= ja, level: v / peak, flash: ja != null && t >= ja && t < ja + 3 };
        },
      });
      const head = g.append("line").attr("y1", 0).attr("y2", ph - 26).attr("stroke", T().ink).attr("opacity", 0.55);
      updates.push((t) => { strip(t); head.attr("x1", x(Math.min(t, tmax))).attr("x2", x(Math.min(t, tmax))).attr("opacity", t >= tmax ? 0 : 0.55); });
      y0 += ph + panelGap;
    });
    const ax = f.g.append("g").attr("transform", `translate(0,${y0 - panelGap})`).call(d3.axisBottom(x).ticks(8).tickSizeOuter(0).tickFormat((v) => v + " s"));
    styleAxis(ax);
    text(f.g, -f.m.left + 8, y0 - panelGap + 30, "items finished per second, stacked: first PCs (light), joiners (solid)", { size: 11, fill: T().muted });
    const draw = (t) => { clip.attr("width", x(Math.min(t, tmax))); updates.forEach((u) => u(t)); };
    const was = this.rp;
    this.rp = replay(tmax, 7, draw);
    draw(was && was.playing ? 0 : tmax);
    if (was && was.playing) this.rp.play();
  },
};

const Churn = {
  CUT: 75,
  mount(root) {
    const K = M.churn || [];
    if (!K.length) return placeholder(root, "Churn: PCs killed and restarted every few seconds while the job runs.",
      "Needs E13 lines (experiment e13, fault churn) with kill and restart events.");
    const host = el("div", { class: "chart-host" });
    root.replaceChildren(el("div", { class: "fig-row" }, K.map((k) => figure(k.result_ok ? "✓ correct" : "✕ failed",
      `${NAME[k.system]}: ${k.kills} kill${k.kills === 1 ? "" : "s"}, ${f0(k.items_rerun || 0)} items recomputed, ${fmtS(k.wall)}${k.error ? " · " + k.error.replace(/^exit (\d+):.*/, "exit $1") : ""}`, { mark: k.system, cls: k.result_ok ? "good" : "bad" }))),
    host, el("div", { class: "replay-ctl" }, el("button", { class: "ctl", text: "↻ Replay", onclick: () => this.rp && this.rp.play() })),
    tableView([["System", (k) => NAME[k.system]], ["Result", (k) => (k.result_ok ? "correct" : "failed")], ["Wall", (k) => fmtS(k.wall)],
      ["No-churn wall (E1b)", (k) => fmtS(k.no_churn_wall)], ["Kills", (k) => k.kills], ["Items recomputed", (k) => f0(k.items_rerun || 0)],
      ["Items counted / total", (k) => `${f0(k.items_counted || 0)} / ${f0(k.items_total || 0)}`], ["Error", (k) => k.error || "–"]], K));
    chart(host, (t) => this.draw(t, K));
    onEnter(host, () => this.rp && this.rp.play());
  },
  draw(target, K) {
    const rowH = 30, gap = 34;
    const pcsOf = (k) => [...new Set(k.hosts.concat(Object.keys(k.per_pc)))].sort(pcSort);
    const heights = K.map((k) => pcsOf(k).length * rowH + 8);
    const f = frame(target, { height: d3.sum(heights) + gap * (K.length - 1) + 64, margin: { left: 80, right: 170, top: 22, bottom: 40 }, name: "e13-churn" });
    const tmax = Math.min(this.CUT, d3.max(K, (k) => k.wall));
    const x = d3.scaleLinear([0, tmax], [0, f.w]);
    const clipId = "churnclip" + Math.random().toString(36).slice(2, 7);
    const defs = f.svg.append("defs");
    const clip = defs.append("clipPath").attr("id", clipId).append("rect").attr("y", -10).attr("height", f.h + 20).attr("width", f.w);
    const hatch = "hatch" + clipId;
    defs.append("pattern").attr("id", hatch).attr("width", 6).attr("height", 6).attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)")
      .append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 6).attr("stroke", T().bad).attr("stroke-width", 1.2).attr("opacity", 0.55);
    const updates = [];
    let y0 = 0;
    K.forEach((k, idx) => {
      const g = f.g.append("g").attr("transform", `translate(0,${y0})`);
      const pcs = pcsOf(k);
      const peak = d3.max(Object.values(k.per_pc), (v) => d3.max(v)) || 1;
      // Down windows per PC: kill -> next restart.
      const down = {};
      for (const pc of pcs) {
        const ev = k.events.filter((e) => e.pc === pc).sort((a, b) => a.t - b.t);
        const w = [];
        ev.forEach((e) => { if (e.kind === "kill") w.push([e.t, k.wall]); else if (e.kind === "restart" && w.length) w[w.length - 1][1] = e.t; });
        down[pc] = w;
      }
      const plot = g.append("g").attr("clip-path", `url(#${clipId})`);
      pcs.forEach((pc, i) => {
        const yb = i * rowH + rowH - 4, yt = i * rowH + 4;
        const y = d3.scaleLinear([0, peak], [yb, yt]);
        g.append("line").attr("x1", 0).attr("x2", f.w).attr("y1", yb + 0.5).attr("y2", yb + 0.5).attr("stroke", T().grid);
        for (const [a, b] of down[pc]) {
          if (a > tmax) continue;
          plot.append("rect").attr("x", x(a)).attr("width", Math.max(2, x(Math.min(b, tmax)) - x(a))).attr("y", yt - 2).attr("height", yb - yt + 2).attr("fill", `url(#${hatch})`);
          g.append("path").attr("d", d3.symbol(d3.symbolCross, 30)()).attr("transform", `translate(${x(a)},${yt - 1}) rotate(45)`).attr("fill", T().bad);
        }
        const v = k.per_pc[pc];
        if (!v) return;
        const pts = series(v.slice(0, Math.ceil(tmax / k.bin_s) + 1), k.bin_s);
        plot.append("path").attr("d", stepArea(x, y, pts)).attr("fill", C(k.system)).attr("opacity", 0.2);
        plot.append("path").attr("d", d3.line().curve(d3.curveStepAfter).x((d) => x(d[0])).y((d) => y(d[1]))(pts))
          .attr("fill", "none").attr("stroke", C(k.system)).attr("stroke-width", 1.5);
      });
      if (k.wall <= tmax) rule(g, x(k.wall), pcs.length * rowH, k.result_ok ? "✓ done" : "✕ exit", { y0: -12, stroke: k.result_ok ? T().good : T().bad, fill: k.result_ok ? T().good : T().bad, opacity: 1 });
      else text(g, f.w - 4, -6, `→ runs on to ${fmtS(k.wall)}, axis cut at ${tmax} s`, { size: 10.5, anchor: "end", fill: T().muted });
      text(g, f.w + 14, 12, NAME[k.system], { size: 13, weight: 650, fill: T().ink });
      text(g, f.w + 14, 30, k.result_ok ? `✓ correct in ${fmtS(k.wall)}` : `✕ failed at ${fmtS(k.wall)}`, { size: 11.5, fill: k.result_ok ? T().good : T().bad, weight: 600 });
      text(g, f.w + 14, 46, `${k.kills} kills · ${f0(k.items_rerun || 0)} recomputed`, { size: 11, fill: T().ink2 });
      if (k.error) text(g, f.w + 14, 62, k.error.length > 26 ? k.error.slice(0, 25) + "…" : k.error, { size: 10.5, fill: T().muted });
      const strip = tileStrip(g.append("g").attr("transform", `translate(${-f.m.left + 8},0)`), pcs, 0, rowH, {
        color: C(k.system),
        state: (pc, t) => ({
          present: true, down: t < k.wall && down[pc].some(([a, b]) => t >= a && t < b),
          level: !k.per_pc[pc] || t > k.wall ? 0 : atBin(k.per_pc[pc], k.bin_s, t) / peak,
        }),
      });
      const head = g.append("line").attr("y1", 0).attr("y2", pcs.length * rowH).attr("stroke", T().ink).attr("opacity", 0.55);
      updates.push((t) => { strip(t); head.attr("x1", x(t)).attr("x2", x(t)).attr("opacity", t >= tmax ? 0 : 0.55); });
      y0 += heights[idx] + gap;
    });
    const ax = f.g.append("g").attr("transform", `translate(0,${y0 - gap})`).call(d3.axisBottom(x).ticks(8).tickSizeOuter(0).tickFormat((v) => v + " s"));
    styleAxis(ax);
    text(f.g, -f.m.left + 8, y0 - gap + 32, "items finished per second, per PC · hatched: killed until restarted", { size: 11, fill: T().muted });
    const draw = (t) => { clip.attr("width", x(Math.min(t, tmax))); updates.forEach((u) => u(t)); };
    const was = this.rp;
    this.rp = replay(tmax, 8, draw);
    draw(was && was.playing ? 0 : tmax);
    if (was && was.playing) this.rp.play();
  },
};

// --- detail.js
// Where PipedPeer loses (drawn as plainly as where it wins), the swimlanes
// of one run, network bytes per PC, and energy.

// A horizontal dot plot: one row per item, median dot, IQR whisker.
function dotPlot(target, items, { name, unit = "s", height, highlight, ref } = {}) {
  const rowH = 34;
  const f = frame(target, { height: height || items.length * rowH + 48, margin: { left: 132, right: 66, top: 10, bottom: 34 }, minWidth: 260, name });
  const hiV = d3.max(items, (d) => d.hi ?? d.v);
  const x = d3.scaleLinear([0, hiV * 1.1], [0, f.w]).nice();
  axisBottom(f, x, { grid: true, ticks: 5, format: (v) => v + (unit === "×" ? "×" : unit === "ms" ? " ms" : " s") });
  if (ref != null) f.g.append("line").attr("x1", x(ref)).attr("x2", x(ref)).attr("y1", 0).attr("y2", f.h).attr("stroke", T().ink2).attr("opacity", 0.6);
  items.forEach((d, i) => {
    const yy = i * rowH + rowH / 2;
    const strong = highlight && highlight(d);
    text(f.g, -12, yy, d.label, { size: 12, anchor: "end", baseline: "middle", fill: strong ? T().ink : T().ink2, weight: strong ? 650 : 400 });
    if (d.lo != null && d.hi != null) f.g.append("line").attr("x1", x(d.lo)).attr("x2", x(d.hi)).attr("y1", yy).attr("y2", yy).attr("stroke", C(d.s)).attr("stroke-width", 2).attr("stroke-linecap", "round").attr("opacity", 0.6);
    for (const p of d.points || []) f.g.append("circle").attr("cx", x(p)).attr("cy", yy).attr("r", 3).attr("fill", C(d.s)).attr("opacity", 0.45);
    if (d.v == null) { text(f.g, 6, yy, d.missing || "no usable run", { size: 11, baseline: "middle", fill: T().muted }); return; }
    const mk = marker(f.g, d.s, x(d.v), yy, strong ? 100 : 64);
    if (d.hollow) mk.attr("fill", T().raised).attr("stroke", C(d.s)).attr("stroke-width", 1.5);
    text(f.g, x(Math.max(d.hi ?? d.v, ...(d.points || []))) + 10, yy, d.text || (unit === "×" ? fmtX(d.v) : unit === "ms" ? f0(Math.round(d.v)) + " ms" : fmtS(d.v)), { size: 11.5, baseline: "middle", fill: T().ink2, weight: strong ? 650 : 400 });
    hit(f.g, x(d.v), yy, 14, (ev) => tip.show(ev, d.label, [[C(d.s), d.text || String(d.v), d.note || ""]]));
  });
  return f;
}

const Losses = {

        el("h3", { text: c.title }), el("p", { text: c.body }), host, c.table, STAMP ? el("div", { class: "stamp", text: STAMP }) : null);
      setTimeout(() => chart(host, c.draw));
      return node;
    })));
  },
  // The workload where PipedPeer is slowest relative to plain at the largest N.
  w2() {
    const cand = WORKLOADS.map((w) => ({ w, v: sp(w, "pipedpeer", NMAX) })).filter((d) => d.v != null).sort((a, b) => a.v - b.v)[0];
    if (!cand || cand.v >= 1) return null;
    const items = ["plain"].concat(SYS).map((s) => {
      const r = row(cand.w, s, s === "plain" ? 1 : NMAX) || {};
      return { s, label: `${NAME[s]}${s === "plain" ? ", N = 1" : ""}`, v: r.speedup_vs_plain, note: `median wall ${fmtS(r.median_wall_s)}, ${r.runs_used || 0} used, ${r.failed_excluded || 0} failed` };
    });
    const pr = row(cand.w, "pipedpeer", NMAX) || {};
    return {
      tag: `${cand.w} at N = ${NMAX}`, title: `Slower than plain Python on ${cand.w}`,
      body: `At N = ${NMAX} PipedPeer reaches ${fmtX(cand.v)} of plain's speed on one PC${pr.failed_excluded ? `, and ${pr.failed_excluded} of its runs failed` : ""}. ${cand.w === "W2" ? "W2 ships large arrays; in a 1 GB container one run hit the OOM killer (exit 137)." : ""}`,
      draw: (t) => dotPlot(t, items, { name: `loss-${cand.w}`, unit: "×", ref: 1, highlight: (d) => d.s === "pipedpeer" }),
      table: tableView([["System", (d) => d.label], ["Speedup", (d) => fmtX(d.v)], ["Note", (d) => d.note]], items),
    };
  },
  e4() {
    const G = M.groups.e4 || [];
    if (!G.length) return null;
    const lab = { pipedpeer: "PipedPeer, measured split", "pipedpeer-headcount": "PipedPeer, even split", ray: "Ray", dask: "Dask" };
    const items = G.filter((r) => r.median_wall_s != null).map((r) => ({ s: fam(r.system), label: lab[r.system] || r.system, v: r.median_wall_s,
      lo: r.q1_wall_s, hi: r.q3_wall_s, hollow: r.system === "pipedpeer-headcount", sys: r.system, note: `median [IQR] ${f2(r.q1_wall_s)}–${f2(r.q3_wall_s)} s, ${r.runs_used} runs` }))
      .sort((a, b) => a.v - b.v);
    const me = items.find((d) => d.sys === "pipedpeer");
    const rank = items.indexOf(me) + 1;
    return {
      tag: "E4 · uneven PCs", title: rank === items.length ? "Its measured split came last" : `Its measured split ranked ${rank} of ${items.length}`,
      body: `Every system capped the same way (taskset). PipedPeer's speed-measured split took ${fmtS(me && me.v)}, slower than the even split it replaced and than ${items.filter((d) => d.v < (me ? me.v : 0) && d.s !== "pipedpeer").map((d) => d.label).join(" and ") || "none"}.`,
      draw: (t) => dotPlot(t, items, { name: "loss-e4", highlight: (d) => d.sys === "pipedpeer" }),
      table: tableView([["Variant", (d) => d.label], ["Median wall", (d) => fmtS(d.v)], ["IQR", (d) => `${f2(d.lo)}–${f2(d.hi)}`]], items),
    };
  },
  e7() {
    const R = M.e7 || [];
    const on = R.filter((r) => r.system === "pipedpeer-shim"), off = R.filter((r) => r.system === "pipedpeer-noshim");
    if (!on.length || !off.length) return null;
    const mOn = d3.median(on, (r) => r.wall), mOff = d3.median(off, (r) => r.wall);
    const items = [{ s: "plain", label: "shim off", v: mOff * 1000, points: off.map((r) => r.wall * 1000), hollow: true },
      { s: "pipedpeer", label: "shim on", v: mOn * 1000, points: on.map((r) => r.wall * 1000) }];
    return {
      tag: "E7 · overhead", title: `+${f0(Math.round((mOn - mOff) * 1000))} ms on every job`,
      body: `A trivial script, whole job, shim on against shim off: the interception costs ${f0(Math.round((mOn - mOff) * 1000))} ms per job here (${on.length} and ${off.length} repeats). On a 10 s job that is ${d3.format(".1%")((mOn - mOff) / 10)}; on a 0.2 s job it is most of the job.`,
      draw: (t) => dotPlot(t, items, { name: "loss-e7", unit: "ms", highlight: (d) => d.s === "pipedpeer" }),
      table: tableView([["Shim", (d) => d.label], ["Median ms", (d) => f0(Math.round(d.v))], ["Repeats, ms", (d) => d.points.map((p) => Math.round(p)).join(", ")]], items),
    };
  },
  joiner() {
    const j = (M.join || []).find((x) => x.system === "pipedpeer");
    if (!j) return null;
    const pcs = Object.keys(j.per_pc).sort(pcSort);
    const tot = d3.sum(pcs, (pc) => d3.sum(j.per_pc[pc]));
    const parts = pcs.map((pc) => ({ pc, v: d3.sum(j.per_pc[pc]), late: (j.cohorts[pc] || 0) > 0 }));
    const late = d3.sum(parts.filter((p) => p.late), (p) => p.v);
    return {
      tag: "E12 · elastic join", title: `The joiner ran ${d3.format(".0%")(late / tot)} of the items`,
      body: `PipedPeer listed the new PC ${j.events[0] && j.events[0].seen != null ? f1(j.events[0].seen - j.events[0].t) + " s after it joined" : "late"}, then gave it ${f0(late)} of ${f0(tot)} items. Dask gave its joiner far more, though its run took ${fmtS(((M.join || []).find((x) => x.system === "dask") || {}).wall)}.`,
      draw: (t) => this.segBar(t, parts, tot),
      table: tableView([["PC", (p) => p.pc], ["Items", (p) => f0(p.v)], ["Share", (p) => d3.format(".1%")(p.v / tot)], ["Joined mid-run", (p) => (p.late ? "yes" : "no")]], parts),
    };
  },
  // Tall segmented bar: one whole, split by PC; joiners solid, the rest light.
  segBar(target, parts, tot) {
    const f = frame(target, { height: 96, margin: { left: 0, right: 0, top: 18, bottom: 28 }, minWidth: 260, name: "loss-joiner" });
    const x = d3.scaleLinear([0, tot], [0, f.w]);
    let acc = 0;
    for (const p of parts) {
      const w = Math.max(0, x(p.v) - 2);
      if (w > 0) f.g.append("rect").attr("x", x(acc)).attr("width", w).attr("height", 28).attr("rx", 4).attr("fill", C("pipedpeer")).attr("opacity", p.late ? 1 : 0.28);
      const lab = `${p.pc} ${d3.format(".0%")(p.v / tot)}`;
      if (w > lab.length * 7 + 12) text(f.g, x(acc) + 8, 14, lab, { size: 11.5, baseline: "middle", fill: p.late ? "#ffffff" : T().ink, weight: 600 });
      else text(f.g, x(acc) + w / 2, 46, lab, { size: 11, anchor: "middle", fill: T().ink2, weight: 600 });
      f.g.append("rect").attr("x", x(acc)).attr("width", Math.max(w, 24)).attr("height", 28).attr("fill", "transparent")
        .on("pointermove", (ev) => tip.show(ev, p.pc, [[C("pipedpeer"), f0(p.v) + " items", d3.format(".1%")(p.v / tot) + (p.late ? ", joined mid-run" : "")]])).on("pointerleave", () => tip.hide());
      acc += p.v;
    }
    text(f.g, 0, -6, "items run, by PC", { size: 11, fill: T().muted });
  },
};

const Lanes = {
  mount(root) {
    const L = (M.lanes || []).filter((l) => l.compute.length || Object.keys(l.cpu).length);
    if (!L.length) return placeholder(root, "Swimlanes: each chunk's compute step on each PC.", "Needs receipts (steps) or OTel CPU per run.");
    const pick = el("select", { class: "pick", "aria-label": "Run", onchange: () => this.show(+pick.value) });
    L.forEach((l, i) => pick.append(el("option", { value: i, text: `${l.experiment.toUpperCase()} · ${l.workload} · ${NAME[fam(l.system)] || l.system}${l.system !== fam(l.system) ? " (" + l.system + ")" : ""} · N = ${l.n}${l.fault && l.fault !== "none" ? " · " + l.fault : ""} · ${fmtS(l.wall)}` })));
    const best = Math.max(0, L.findIndex((l) => l.system === "pipedpeer" && l.compute.length && l.n === d3.max(L, (q) => q.n) && l.experiment === "e1"));
    pick.value = best;
    this.L = L;
    this.cur = L[best];
    this.host = el("div", { class: "chart-host" });
    this.net = el("div", { class: "chart-host" });
    root.replaceChildren(el("div", { class: "toolbar" }, pick), el("div", { class: "lanes-split" },
      el("div", {}, el("div", { class: "mini-title", text: "Where the work ran" }), this.host),
      el("div", {}, el("div", { class: "mini-title", text: "Bytes on the wire, per PC" }), this.net)));
    this.lane = chart(this.host, (t) => this.drawLanes(t));
    this.bytes = chart(this.net, (t) => this.drawNet(t));
    this.show(best);
  },
  show(i) { this.cur = this.L[i]; this.lane.draw(this.host); this.bytes.draw(this.net); },
  drawLanes(target) {
    const l = this.cur;
    if (!l) return;
    const pcs = [...new Set(M.meta.pcs.concat(l.compute.map((c) => c[0])))].sort(pcSort);
    const sub = (pc) => (l.rows && l.rows[pc]) || 1;
    const rowH = 16, gap = 12;
    const heights = pcs.map((pc) => Math.max(1, sub(pc)) * rowH + 22);
    const f = frame(target, { height: d3.sum(heights) + gap * pcs.length + 44, margin: { left: 56, right: 18, top: 8, bottom: 36 }, name: "swimlanes" });
    const tmax = Math.max(l.wall || 0, d3.max(l.compute, (c) => c[2] + c[3]) || 0);
    const x = d3.scaleLinear([0, tmax], [0, f.w]).nice();
    axisBottom(f, x, { grid: true, ticks: 8, format: (v) => v + " s" });
    const peak = d3.max(Object.values(l.cpu), (s) => d3.max(s, (p) => p[1])) || 1;
    let y0 = 0;
    pcs.forEach((pc, i) => {
      const hh = heights[i];
      text(f.g, -10, y0 + 12, pc, { size: 11, anchor: "end", baseline: "middle", fill: l.hosts.includes(pc) ? T().ink2 : T().muted, weight: 600 });
      // CPU wash behind the lanes: every system has it.
      const cpu = (l.cpu[pc] || []).filter((p) => p[0] >= -0.5 && p[0] <= tmax + 0.5);
      if (cpu.length) {
        const y = d3.scaleLinear([0, peak], [y0 + hh - 4, y0 + 2]);
        f.g.append("path").attr("d", d3.area().curve(d3.curveMonotoneX).x((p) => x(Math.max(0, p[0]))).y0(y0 + hh - 4).y1((p) => y(p[1]))(cpu)).attr("fill", C(l.system)).attr("opacity", 0.1);
        f.g.append("path").attr("d", d3.line().curve(d3.curveMonotoneX).x((p) => x(Math.max(0, p[0]))).y((p) => y(p[1]))(cpu)).attr("fill", "none").attr("stroke", C(l.system)).attr("stroke-width", 1).attr("opacity", 0.5);
      }
      for (const [cpc, r, t, d] of l.compute.filter((c) => c[0] === pc)) {
        const bx = x(t), bw = Math.max(2, x(t + d) - x(t) - 2), by = y0 + 4 + r * rowH;
        f.g.append("rect").attr("x", bx).attr("y", by).attr("width", bw).attr("height", rowH - 4).attr("rx", 3).attr("fill", C(l.system)).attr("opacity", 0.9)
          .on("pointermove", (ev) => tip.show(ev, `${cpc} · compute`, [[C(l.system), fmtS(d), `from ${f2(t)} s`]])).on("pointerleave", () => tip.hide());
      }
      if (!l.compute.length && !cpu.length) text(f.g, 6, y0 + 12, "no samples", { size: 10.5, fill: T().muted, baseline: "middle" });
      y0 += hh + gap;
    });
    text(f.g, -f.m.left + 4, f.h + 30, l.compute.length ? "bars: the receipt's compute steps · wash: busy cores (OTel)" : "busy cores per PC (OTel); this system records no per-task timeline here", { size: 10.5, fill: T().muted });
  },
  drawNet(target) {
    const l = this.cur;
    const pcs = Object.keys(l.net || {}).sort(pcSort);
    if (!pcs.length) return placeholder(target, "Bytes sent and received per PC during this run.", "Needs OTel system.network.io for the run's window.");
    const rowH = 30;
    const f = frame(target, { height: pcs.length * rowH + 60, margin: { left: 48, right: 70, top: 8, bottom: 40 }, minWidth: 240, name: "net-bytes" });
    const x = d3.scaleLinear([0, d3.max(pcs, (pc) => l.net[pc].tx + l.net[pc].rx) || 1], [0, f.w]).nice();
    axisBottom(f, x, { grid: true, ticks: 4, format: (v) => fmtB(v) });
    pcs.forEach((pc, i) => {
      const yy = i * rowH + 6, { tx, rx } = l.net[pc];
      text(f.g, -10, yy + 9, pc, { size: 11, anchor: "end", baseline: "middle", fill: T().ink2, weight: 600 });
      const wt = Math.max(0, x(tx) - 2), wr = Math.max(0, x(tx + rx) - x(tx));
      f.g.append("rect").attr("x", 0).attr("y", yy).attr("width", wt).attr("height", 18).attr("rx", 3).attr("fill", C(l.system));
      f.g.append("rect").attr("x", x(tx)).attr("y", yy).attr("width", wr).attr("height", 18).attr("rx", 3).attr("fill", C(l.system)).attr("opacity", 0.4);
      text(f.g, x(tx + rx) + 8, yy + 9, fmtB(tx + rx), { size: 11, baseline: "middle", fill: T().ink2 });
      f.g.append("rect").attr("x", 0).attr("y", yy - 4).attr("width", Math.max(x(tx + rx), 24)).attr("height", 26).attr("fill", "transparent")
        .on("pointermove", (ev) => tip.show(ev, pc, [[C(l.system), fmtB(tx), "sent"], [C(l.system), fmtB(rx), "received"]])).on("pointerleave", () => tip.hide());
    });
    text(f.g, -f.m.left + 4, f.h + 32, "solid: sent · light: received", { size: 10.5, fill: T().muted });
  },
};

const E6 = {
  mount(root) {
    const R = (M.e6 || []).filter((r) => SYS.includes(r.system));
    if (!R.length) return root.remove();
    const items = [];
    for (const s of SYS) {
      const none = R.find((r) => r.system === s && r.fault === "none"), kill = R.find((r) => r.system === s && r.fault && r.fault !== "none");
      if (none) items.push({ s, label: `${NAME[s]}, no fault`, v: none.wall_s, hollow: true });
      if (kill) items.push({ s, label: `${NAME[s]}, one kill`, v: kill.wall_s, text: `${fmtS(kill.wall_s)} (${kill.wall_s - (none ? none.wall_s : kill.wall_s) >= 0 ? "+" : "−"}${f1(Math.abs(kill.wall_s - (none ? none.wall_s : kill.wall_s)))} s)${kill.result_ok ? " ✓" : " ✕"}` });
    }
    const host = el("div", { class: "chart-host" });
    root.replaceChildren(el("div", { class: "mini-title", text: "E6 · one worker killed at 30% of the run (hollow: no fault)" }), host,
      tableView([["Run", (d) => d.label], ["Wall", (d) => d.text || fmtS(d.v)]], items));
    chart(host, (t) => dotPlot(t, items, { name: "e6-kill", highlight: (d) => d.s === "pipedpeer" }));
  },
};

const Energy = {
  mount(root) {
    if (!M.energy) placeholder(root, "Energy per job: joules from RAPL on each PC, per system, at the same N.", "The lab day's telemetry has no energy scraper yet; this section stays empty until it does.");
  },
};

// --- main.js
// The page: masthead, the hero replay, then one chapter per question, each a
// headline number with its evidence chart under it. Prose that quotes a
// number reads it from the model, so the lab day's data rewrites it.
(function main() {
  document.documentElement.dataset.theme = T().mode;
  const app = $("#app");
  const meta = M.meta;
  const exportHero = new URLSearchParams(location.search).get("export") === "hero";
  if (exportHero) document.body.classList.add("export-hero");

  // --- top bar: brand, stamp, theme switch, reading progress -------------------
  const toggle = el("button", { class: "theme-toggle", "aria-label": "Switch light or dark", onclick: () => {
    setTheme(T().mode === "dark" ? "light" : "dark"); Hero.redraw(); toggle.textContent = T().mode === "dark" ? "☀ Light" : "☾ Dark";
  }, text: T().mode === "dark" ? "☀ Light" : "☾ Dark" });
  const bar = el("header", { class: "topbar" }, el("a", { class: "brand", href: "#top" }, el("span", { class: "brand-dot" }), "PipedPeer", el("span", { class: "brand-sub", text: "lab campaign" })),
    STAMP ? el("div", { class: "topstamp", text: STAMP }) : el("div"), toggle, el("div", { class: "progress" }));
  addEventListener("scroll", () => { bar.lastChild.style.transform = `scaleX(${scrollY / Math.max(1, document.body.scrollHeight - innerHeight)})`; }, { passive: true });

  // --- masthead + hero ---------------------------------------------------------
  const H = M.hero;
  const lines = (s) => (M.port_lines || []).filter((p) => p.system === s).map((p) => p.lines);
  const heroBox = el("div", { class: "hero-host" });
  const caveat = meta.emulated && H ? el("aside", { class: "callout" }, el("div", { class: "callout-k", text: "Read this before the race" }),
    el("p", { text: `These are containers on one laptop, and each one sees all ${d3.max(Object.values(meta.cores)) || "its"} of the host's cores. Ray, Dask and plain Python were held to 2 processes; PipedPeer's shim widened its local pool to every core it could see. That is most of why PipedPeer finishes first here. On real PCs every system sees the same cores; E4, where taskset caps all four the same way, is the fair comparison in this sample, and there they land within ${E4spread()}.` })) : null;
  const mast = el("section", { class: "mast", id: "top" },
    el("div", { class: "kicker", text: `Lab campaign · ${meta.pcs.length} PCs · ${meta.runs} runs${meta.label ? " · " + meta.label : ""}` }),
    el("h1", {}, "One unmodified script.", el("br"), el("span", { class: "dim", text: "Every machine in the room." })),
    el("p", { class: "dek", text: `pipedpeer run main.py builds the script's environment, ships it to the PCs it finds and spreads its Pool, joblib, pandas, numpy and torch work across them. Ray and Dask need the script rewritten: ${d3.min(lines("ray")) ?? "?"}–${d3.max(lines("ray")) ?? "?"} lines for Ray, ${d3.min(lines("dask")) ?? "?"}–${d3.max(lines("dask")) ?? "?"} for Dask. Here is the same job on all three, replayed from the runs' own telemetry.` }),
    meta.emulated ? el("div", { class: "banner" }, el("b", { text: "Emulated data. " }), `Every number on this page comes from the container sample and its rehearsal: ${meta.pcs.length} containers with 1 GB each, at sample sizes. None is a result. The lab day's PCs regenerate the page with one command, and every chart and sentence is rewritten from that data.`) : null,
    heroBox, caveat);

  // --- chapters ------------------------------------------------------------------
  const chapters = [
    ["scaling", "01", "Speedup", "Speedup with nothing changed",
      "Strong scaling: the same work on more PCs. Speedup is plain Python's median wall on one PC over each system's median wall at N. Drag N; the shaded band is slower than plain.", Scaling],
    ["frontier", "02", "Effort", "Zero lines changed",
      "What a speedup costs to get. Each mark is a workload: the lines changed to run it on that system (port-lines.csv) against its speedup at the largest N. Upper left is better.", Frontier],
    ["join", "03", "Elastic join", "A PC joins while the job runs",
      "E12. The job starts on a few PCs and more join mid-run. The stack should step up after each join; a joiner that stays flat at zero was never given work.", Join],
    ["churn", "04", "Churn", "PCs die while the job runs",
      "E13. Every few seconds a PC is killed, then restarted. The work it held has to go somewhere else, and the answer still has to be right.", Churn],
    ["staircase", "05", "Setup", "From curl to cluster",
      "E14. One row per PC: the install line, SSH, the install finishing, joining, and the first work it ran. The number is the time until every PC has run something.", Staircase],
    ["network", "06", "Latency", "Add network delay",
      "E15. netem adds round-trip time between every pair of PCs. Each line is a system's wall at that delay over its own wall at 0 ms: flat is good.", Network],
    ["losses", "07", "Honest", "Where it loses",
      "The same data, read for the cases that go against PipedPeer. These are not footnotes; each one is a thing to fix or a limit to state.", Losses],
    ["inside", "08", "Inside a run", "Where the work ran",
      "Pick any representative run (the median-wall repeat of its group). Bars are the receipt's compute steps per PC; the wash behind them is busy cores from OTel.", Lanes],
  ];
  const nav = el("nav", { class: "chapnav", "aria-label": "Chapters" }, chapters.map(([id, num, short]) => el("a", { href: "#" + id }, el("span", { text: num }), short)));
  const body = chapters.map(([id, num, short, title, lede, mod]) => {
    const host = el("div", { class: "chapter-body" });
    const sec = el("section", { class: "chapter", id }, el("div", { class: "chapter-head" },
      el("div", { class: "chapter-num", text: `${num} · ${short}` }), el("h2", { text: title }), el("p", { class: "lede", text: lede })), host);
    return { sec, host, mod, id };
  });
  const method = el("section", { class: "chapter method", id: "method" }, el("div", { class: "chapter-head" },
    el("div", { class: "chapter-num", text: "Method" }), el("h2", { text: "How this page was made" })),
  el("div", { class: "cols" },
    el("div", {}, el("h4", { text: "Data" }), el("p", { text: `${meta.runs} runs (${meta.failed} failed, excluded and counted) across ${meta.experiments.map((e) => e.toUpperCase()).join(", ")}; about ${Math.round(meta.span_min)} minutes of runs. Per-PC CPU from OTel ${[...new Set(Object.values(meta.cpu_source))].join(" and ")} samples, 1 s apart, interpolated in the replays. Chunk placement from the pipedpeer receipt and timeline.py's chunks.json. Medians with IQR over repeats; warm-ups excluded.` })),
    el("div", {}, el("h4", { text: "Regenerate" }), el("pre", {}, el("code", { text: meta.command })), el("p", { text: `Generated ${meta.generated}. One file, no network: data, d3 v7.9.0 and the scripts are inlined. Every chart has a Table under it.` })),
    el("div", {}, el("h4", { text: "Colour" }), el("p", { text: "PipedPeer, Ray and Dask take the first three slots of one categorical palette, checked for colour-vision separation in both modes. Each system also has its own marker shape (● ■ ▲, plain ◇) and direct labels, so no reading depends on colour alone." }))));

  if (exportHero) {
    if (H) heroBox.dataset.title = `PipedPeer · Ray · Dask — ${H.workload} on ${H.n} worker PC${H.n > 1 ? "s" : ""}`;
    heroBox.dataset.stamp = STAMP;
    app.replaceChildren(heroBox);
    mountHero(heroBox, true);
    return;
  }
  app.replaceChildren(bar, mast, nav, ...body.map((b) => b.sec), method,
    el("footer", { class: "foot", text: STAMP ? STAMP + "." : "PipedPeer lab campaign." }));
  mountHero(heroBox, false);
  for (const b of body) {
    try { b.mod.mount(b.host); } catch (e) { console.error(b.id, e); placeholder(b.host, "This section could not be drawn from the data.", String(e.message || e)); }
    io.observe(b.sec);
  }
  const extra = el("div", { class: "chapter-sub" });
  body.find((b) => b.id === "churn").host.append(extra);
  E6.mount(extra);
  const energy = el("div", { class: "chapter-sub" }, el("div", { class: "mini-title", text: "Energy" }), el("div"));
  body.find((b) => b.id === "inside").host.append(energy);
  Energy.mount(energy.lastChild);
  // Chapter nav highlights the section on screen.
  const navIO = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) nav.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  body.forEach((b) => navIO.observe(b.sec));

  function mountHero(box, still) {
    Hero.mount(box);
    window.__story = { hero: Hero, ready: true, sections: chapters.map((c) => c[0]), replays: () => [Join.rp, Churn.rp, Staircase.rp] };
    if (!still && Hero.ok) setTimeout(() => Hero.play(), 500);
  }
  function E4spread() {
    const g = (M.groups.e4 || []).filter((r) => r.median_wall_s != null);
    if (!g.length) return "a few percent of each other";
    return `${f1(d3.min(g, (r) => r.median_wall_s))}–${f1(d3.max(g, (r) => r.median_wall_s))} s`;
  }
})();
</script>
</body>

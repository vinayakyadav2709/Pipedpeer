services:
  worker1:
    build: .
    container_name: pipedpeer-lab-1
    privileged: true
    network_mode: host
    volumes:
      - ./pipedpeer:/usr/local/bin/pipedpeer:ro
    environment:
      - XDG_DATA_HOME=/var/lib/pipedpeer
    command: ["sh", "-c", "/usr/local/bin/pipedpeer setup -y --port 38081 && echo 'Worker-1 online :38081' && exec sleep infinity"]

  worker2:
    build: .
    container_name: pipedpeer-lab-2
    privileged: true
    network_mode: host

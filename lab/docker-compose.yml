services:
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.nix
    container_name: worker-1
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    ports:
      - "2221:22"

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.nix
    container_name: worker-2
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    ports:
      - "2222:22"

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.nix
    container_name: worker-3
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    ports:
      - "2223:22"

services:
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.nix
    container_name: worker-1
    privileged: true
    network: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    command: ["sh", "-c", "mkdir -p /usr/local/bin && while true; do sleep 1; done"]
    environment:
      - NODE_ID=worker-1


name: Release

on:
  push:
    tags:
      - 'v*' # Stable releases only; nightly is published by nightly.yml

permissions:
  contents: write # Required to publish a GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for GoReleaser to read tags properly
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'src/go.mod'
          
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
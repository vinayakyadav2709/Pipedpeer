name: CI

on:
  # Pushes to dev deliberately run nothing: dev is the nightly stream and is
  # published unverified. CI still runs on pull requests into dev and on main.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: Install Python deps for shim tests
        run: |
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet pandas joblib scikit-learn

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      # The shim is supposed to cost nothing when a job never touches an
      # interceptable library. Nothing enforced that, and it regressed to 21x
      # by importing torch at startup. Gate it here.
      - name: Shim overhead (never-slower budget)
        working-directory: ${{ github.workspace }}
        run: ./scripts/bench-shim-d2.sh

      # A green suite that skipped every test touching the cluster proves
      # nothing. Six shim tests skip without pandas and they are exactly the
      # ones exercising a remote path; the suite still printed ok.
      - name: Distribution tests actually ran
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-skips.sh

      # Interception must not cost more than it saves. With no peers this
      # only checks the never-slower budget; with a cluster it becomes the
      # manual-versus-automatic comparison.
      - name: Pool benchmark (never-slower budget)
        working-directory: ${{ github.workspace }}
        run: BENCH_ITEMS=32 BENCH_SPIN=200000 ./scripts/bench-pool.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null .

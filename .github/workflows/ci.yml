name: CI

on:
  # Runs on every push to dev and main, and on pull requests into either.
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: Install Python deps for shim tests
        run: |
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet pandas joblib scikit-learn

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Shim lint and unit tests
        working-directory: ${{ github.workspace }}
        run: ./scripts/shim-check.sh

      # landing/public/lab.sh is what the lab PCs run; it must be
      # scripts/campaign/lab.sh apart from the lines publish.sh fills in.
      - name: Published lab.sh matches the source
        working-directory: ${{ github.workspace }}
        run: bash scripts/campaign/lab-fill.sh check

      # The shim is supposed to cost nothing when a job never touches an
      # interceptable library. Nothing enforced that, and it regressed to 21x
      # by importing torch at startup. Gate it here.
      - name: Shim overhead (never-slower budget)
        working-directory: ${{ github.workspace }}
        run: ./scripts/bench-shim-d2.sh

      # A green suite that skipped every test touching the cluster proves
      # nothing. Six shim tests skip without pandas and they are exactly the
      # ones exercising a remote path; the suite still printed ok.
      - name: Distribution tests actually ran
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-skips.sh

      # `pipedpeer run` builds the job's environment as a Nix closure, so the
      # benchmark below needs Nix; without it the run stops at "nix not found".
      # Same Nix release as the lab image (lab/Dockerfile).
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.3/install

      # Interception must not cost more than it saves. With no peers this
      # only checks the never-slower budget; with a cluster it becomes the
      # manual-versus-automatic comparison.
      - name: Pool benchmark (never-slower budget)
        working-directory: ${{ github.workspace }}
        run: BENCH_ITEMS=32 BENCH_SPIN=200000 ./scripts/bench-pool.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null .

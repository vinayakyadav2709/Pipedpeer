name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Skip the whole run when dev has not moved since the last published nightly.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

          published="$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || echo '')"
          if [ "$published" = "$head_sha" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dev unchanged since last nightly ($head_sha); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "building nightly for $head_sha"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  # D2 shim-overhead report. Never-slower is structurally enforced by the Go
  # tests; this only trips on a gross regression (shim > 3x a plain local Pool
  # with no daemon reachable), so it is a report, not a tight wall-clock gate.
  d2-bench:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Measure shim overhead
        run: ./scripts/bench-shim-d2.sh

  release:
    needs: [check, test]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Collect artifacts
        run: |
          # "formats: [binary]" leaves each binary at its build path; the
          # published name lives in artifacts.json. Stage them under the names
          # the install script expects.
          mkdir -p upload
          jq -r '.[]
            | select(.type == "Binary" and .extra.Format == "binary")
            | "\(.path)\t\(.name)"' dist/artifacts.json |
          while IFS=$'\t' read -r path name; do
            cp "$path" "upload/$name"
          done
          cp dist/checksums.txt upload/
          ls -l upload

      - name: Publish rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          # Roll the nightly pointer: drop the previous release and its tag,
          # then republish from the current dev commit.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

          notes="Automated nightly build from \`dev\` @ \`${SHA}\`.

          Unstable: built from the development stream and not release tested.
          Install with: \`./scripts/install-pipedpeer.sh --channel nightly\`"

          gh release create nightly \
            --title "Nightly ($(date -u +%Y-%m-%d))" \
            --notes "$notes" \
            --prerelease \
            --target "$SHA" \
            upload/*

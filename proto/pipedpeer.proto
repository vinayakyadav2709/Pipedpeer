syntax = "proto3";

package pipedpeer;

option go_package = "github.com/pipedpeer/pipedpeer/proto;pipedpeerpb";

// Minimal scaffold for future control-plane contracts.
message Empty {}

message NodeCapability {
  string node_id = 1;
  int64 free_ram_bytes = 2;
  int32 free_cpu_cores = 3;
  bool has_gpu = 4;
  int64 free_vram_bytes = 5;
}

message HeartbeatRequest {
  string node_id = 1;
  NodeCapability capability = 2;
}

message HeartbeatResponse {
  bool ok = 1;
}

service RegistryService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

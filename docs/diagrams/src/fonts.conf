<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- For rendering the .dot figures with Nix's graphviz, which does not read
     the system's font aliases: graphviz asks for "DejaVu Sans" when a
     figure names Helvetica, so that name is sent to Nimbus Sans (URW's
     Helvetica clone, in Fedora's urw-base35-fonts). -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
</fontconfig>

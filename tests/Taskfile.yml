version: "3"

vars:
  HOST: 127.0.0.1
  PORT: "38081"
  SCRIPT: ../test_project/single.py

tasks:
  build:
    desc: Build the pipedpeer binary
    dir: ..
    cmds:
      - make build

  lab-up:
    desc: Start the lab container
    dir: ..
    cmds:
      - ./scripts/lab-up.sh

  lab-down:
    desc: Stop the lab container
    dir: ..
    cmds:
      - ./scripts/lab-down.sh

  add-peer:
    desc: Register the lab container as a manual peer
    cmds:
      - ../bin/pipedpeer peers remove {{.HOST}} 2>/dev/null || true
      - ../bin/pipedpeer peers add {{.HOST}} {{.PORT}}

  fetch-id:
    desc: Fetch the lab worker node ID (waits for daemon)
    cmds:
      - mkdir -p .task
      - |-
        echo "Waiting for daemon..."
        for i in $(seq 1 30); do
          ID=$(curl -s http://{{.HOST}}:{{.PORT}}/health | sed -n 's/.*"node_id":"\([^"]*\)".*/\1/p')
          if [ -n "$ID" ]; then
            echo "$ID" > .task/id.txt
            echo "Node ID: $ID"
            exit 0
          fi
          sleep 1
        done
        echo "Daemon not ready after 30s"
        exit 1

  send-task:
    desc: Run test project on lab worker
    vars:
      TARGET_ID:
        sh: cat .task/id.txt 2>/dev/null || echo MISSING-run-fetch-id-first
    cmds:
      - ../bin/pipedpeer run --host {{.HOST}} --daemon-port {{.PORT}} --target-id {{.TARGET_ID}} --isolate=false --script {{.SCRIPT}}

  multi:
    desc: Send 3 tasks to the worker with status checks between each
    vars:
      TARGET_ID:
        sh: cat .task/id.txt 2>/dev/null || echo MISSING-run-fetch-id-first
    cmds:
      - |
        echo 'Worker status before tasks:'
        curl -s http://{{.HOST}}:{{.PORT}}/health
        echo
        echo '-- Task 1/3 --'
        ../bin/pipedpeer run --host {{.HOST}} --daemon-port {{.PORT}} --target-id {{.TARGET_ID}} --isolate=false --script ../test_project/task1.py
        echo
        curl -s http://{{.HOST}}:{{.PORT}}/health
        echo
        echo '-- Task 2/3 --'
        ../bin/pipedpeer run --host {{.HOST}} --daemon-port {{.PORT}} --target-id {{.TARGET_ID}} --isolate=false --script ../test_project/task2.py
        echo
        curl -s http://{{.HOST}}:{{.PORT}}/health
        echo
        echo '-- Task 3/3 --'
        ../bin/pipedpeer run --host {{.HOST}} --daemon-port {{.PORT}} --target-id {{.TARGET_ID}} --isolate=false --script ../test_project/task3.py
        echo
        echo 'Final worker status:'
        curl -s http://{{.HOST}}:{{.PORT}}/health
        echo
        echo 'Output files:'
        ls -la ../test_project/output/ 2>/dev/null || echo none

  dispatch:
    desc: Burst 10 tasks via coordinator auto-placement across 3 workers
    cmds:
      - |
        HOST=127.0.0.1
        PORTS="38081 38082 38083"
        LOG=.task/dispatch.log
        mkdir -p .task/logs

        echo "Dispatch started at $(date)" | tee "$LOG"
        echo "" | tee -a "$LOG"

        # Wait for all workers
        for p in $PORTS; do
          echo "Waiting for worker on port $p..."
          for i in $(seq 1 20); do
            curl -s http://$HOST:$p/health >/dev/null && break
            sleep 1
          done
        done

        # Register peers
        ../bin/pipedpeer peers remove $HOST 2>/dev/null || true
        for p in $PORTS; do
          ../bin/pipedpeer peers add $HOST $p
          echo "  Peer $HOST:$p registered" | tee -a "$LOG"
        done
        echo "" | tee -a "$LOG"

        # Burst all 10 tasks concurrently
        echo "Bursting 10 tasks..." | tee -a "$LOG"
        TASKS=10
        for t in $(seq 1 $TASKS); do
          ../bin/pipedpeer run --no-self --isolate=false --script ../test_project/dispatch_t${t}.py \
            > .task/logs/task${t}.log 2>&1 &
        done
        wait
        echo "" | tee -a "$LOG"
        echo "" | tee -a "$LOG"

        # Analyze results
        declare -A COUNTS
        echo "====================" | tee -a "$LOG"
        echo " COORDINATOR DISPATCH" | tee -a "$LOG"
        echo "====================" | tee -a "$LOG"
        for t in $(seq 1 $TASKS); do
          log=.task/logs/task${t}.log
          status="FAIL"
          worker="?"
          if grep -q "Done" "$log" 2>/dev/null; then
            status="OK"
          fi
          # Extract node ID from coordinator output
          node=$(grep -oP "completed successfully on node \K[a-f0-9]+" "$log" 2>/dev/null || echo "?")
          # Map node prefix to port
          for p in $PORTS; do
            wid=$(curl -s http://$HOST:$p/health | sed -n 's/.*"node_id":"\([0-9a-f]*\).*/\1/p')
            if [ "$node" = "$wid" ]; then
              worker="$p"
              break
            fi
          done
          echo "  task$t [$status] -> worker :${worker}" | tee -a "$LOG"
          if [ "$status" = "OK" ]; then
            COUNTS[$worker]=$(( COUNTS[$worker] + 1 ))
          fi
        done

        echo "" | tee -a "$LOG"
        echo "Per-worker counts:" | tee -a "$LOG"
        for p in $PORTS; do
          echo "  Worker :$p: ${COUNTS[$p]:-0} tasks" | tee -a "$LOG"
        done

        echo "" | tee -a "$LOG"
        echo "Output files:" | tee -a "$LOG"
        ls -laR ../test_project/output/ 2>/dev/null | tee -a "$LOG" || echo "(none)" | tee -a "$LOG"
        echo "" | tee -a "$LOG"
        echo "Log saved to $LOG"

  clean:
    desc: Stop lab, remove peer, cleanup
    cmds:
      - task: lab-down
      - ../bin/pipedpeer peers remove {{.HOST}} 2>/dev/null || true
      - rm -f .task/id.txt

  all:
    desc: Full cycle clean + build + lab-up + add-peer + fetch-id + send-task + clean
    cmds:
      - task: clean
      - task: build
      - task: lab-up
      - task: add-peer
      - task: fetch-id
      - task: send-task
      - task: clean

  all-dispatch:
    desc: Full multi-worker cycle (build + 3 workers + 10 tasks)
    cmds:
      - task: lab-down
      - task: build
      - task: lab-up
      - task: dispatch
      - task: lab-down

  burst:
    desc: Burst tasks via round-robin across all registered peers (uses pipedpeer python shorthand)
    vars:
      COUNT: "6"
      SCRIPT: ../test_project/single.py
    cmds:
      - |
        HOST=127.0.0.1
        PORTS="38081 38082 38083"
        LOG=.task/burst.log
        mkdir -p .task/logs

        echo "=== Burst started at $(date) ===" | tee "$LOG"
        echo "Tasks: {{.COUNT}} | Script: {{.SCRIPT}}" | tee -a "$LOG"
        echo "" | tee -a "$LOG"

        # Wait for all workers
        for p in $PORTS; do
          echo "Waiting for worker on port $p..."
          for i in $(seq 1 20); do
            curl -s http://$HOST:$p/health >/dev/null && break
            sleep 1
          done
        done

        # Register all peers
        ../bin/pipedpeer peers remove $HOST 2>/dev/null || true
        for p in $PORTS; do
          ../bin/pipedpeer peers add $HOST $p
          echo "  Peer $HOST:$p registered" | tee -a "$LOG"
        done
        echo "" | tee -a "$LOG"

        # Worker IDs for later mapping
        declare -A PORT_MAP
        for p in $PORTS; do
          PORT_MAP[$p]=$(curl -s http://$HOST:$p/health | sed -n 's/.*"node_id":"\([0-9a-f-]*\)".*/\1/p' | cut -c1-8)
          echo "  Worker :$p = ${PORT_MAP[$p]}" | tee -a "$LOG"
        done
        echo "" | tee -a "$LOG"

        # Burst all tasks concurrently
        echo "Bursting {{.COUNT}} tasks (round-robin)..." | tee -a "$LOG"
        for t in $(seq 1 {{.COUNT}}); do
          ../bin/pipedpeer python {{.SCRIPT}} > .task/logs/task${t}.log 2>&1 &
        done
        wait
        echo "" | tee -a "$LOG"

        # Analyze results
        declare -A COUNTS
        echo "===================" | tee -a "$LOG"
        echo " ROUND-ROBIN BURST" | tee -a "$LOG"
        echo "===================" | tee -a "$LOG"
        for t in $(seq 1 {{.COUNT}}); do
          log=.task/logs/task${t}.log
          status="FAIL"
          worker="?"
          if grep -q "Done" "$log" 2>/dev/null; then
            status="OK"
          fi
          node=$(grep -oP "completed successfully on node \K[a-f0-9]+" "$log" 2>/dev/null || echo "?")
          for p in $PORTS; do
            if [ "$node" = "${PORT_MAP[$p]}" ]; then
              worker="$p"
              break
            fi
          done
          echo "  task$t [$status] -> :${worker}" | tee -a "$LOG"
          if [ "$status" = "OK" ]; then
            COUNTS[$worker]=$(( COUNTS[$worker] + 1 ))
          fi
        done

        echo "" | tee -a "$LOG"
        echo "Per-worker distribution:" | tee -a "$LOG"
        for p in $PORTS; do
          echo "  :$p (${PORT_MAP[$p]}): ${COUNTS[$p]:-0} tasks" | tee -a "$LOG"
        done

        echo "" | tee -a "$LOG"
        echo "Log saved to $LOG" | tee -a "$LOG"

version: 2

project_name: pipedpeer

# The rolling "nightly" prerelease tag is not semver; without this, once the
# tag exists every snapshot build resolves .Version to "nightly" and
# incpatch fails.
git:
  ignore_tags:
    - nightly

builds:
  - id: pipedpeer
    dir: src
    main: .
    binary: pipedpeer
    env:
      - CGO_ENABLED=0
    # Linux is the only platform that can run jobs (crun sandbox, Linux
    # namespaces, /dev/nvidia*). darwin is built as a submit-side client.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

# By default, GoReleaser creates archives.
# "formats: [binary]" ensures we publish raw binaries instead. Note that this
# does not rename anything on disk: the built binary stays at
# dist/pipedpeer_<os>_<arch>*/pipedpeer and this name is only artifact
# metadata, so uploads read dist/artifacts.json rather than globbing dist/.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-nightly.{{ .Now.Format \"20060102\" }}-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
